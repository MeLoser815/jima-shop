# 即码小店 — 从源码构建镜像（不拉取 GHCR）
#
# 在仓库根目录执行：
#   docker compose -f docker-compose.build.yml up --build -d

services:
  jima-shop:
    build:
      context: .
      dockerfile: Dockerfile
    image: jima-shop:local
    container_name: jima-shop
    restart: unless-stopped
    ports:
      - "3333:3001"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
    volumes:
      - ./data:/data
