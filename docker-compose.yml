services:
  jima-shop:
    image: ghcr.io/meloser815/jima-shop:latest
    container_name: jima-shop
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - HOST=0.0.0.0
    volumes:
      - jima-shop-data:/data

volumes:
  jima-shop-data:
